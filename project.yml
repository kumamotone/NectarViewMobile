name: NectarViewMobile
options:
  bundleIdPrefix: dev.kuma
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  NectarCore:
    path: ../NectarCore
    # For CI/other machines, use:
    # url: https://github.com/kumamotone/NectarCore.git
    # from: 1.0.0

targets:
  NectarViewMobile:
    type: application
    platform: iOS
    sources:
      - NectarViewMobile
    dependencies:
      - package: NectarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kuma.NectarView.mobile
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: NectarView
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportsDocumentBrowser: "YES"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
